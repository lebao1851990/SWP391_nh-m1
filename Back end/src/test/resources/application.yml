spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:plagiarism_system_test}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Kim20042005}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 10000
      max-lifetime: 30000
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT_MS:2000}ms
  flyway:
    enabled: false

queue:
  plagiarism:
    enabled: ${QUEUE_PLAGIARISM_ENABLED:true}
    stream-name: ${QUEUE_PLAGIARISM_STREAM:codeassess:jobs:plagiarism:test}
    consumer-group: ${QUEUE_PLAGIARISM_GROUP:plagiarism-worker-group-test}
    max-retries: 3
    publish-timeout-ms: 2000


server:
  port: 0

app:
  cors:
    allowed-origins: http://localhost:3000
  ai:
    provider: none
    api-key:
    model: gpt-4o-mini
    timeout-seconds: 5
    base-url: https://api.openai.com/v1
    gemini:
      api-key:
      model: gemini-2.5-flash
      timeout-seconds: 5
      base-url: https://generativelanguage.googleapis.com/v1beta

sandbox:
  image: eclipse-temurin:21-jdk-alpine
  timeout-seconds: 10
  max-concurrent-executions: 4
  memory-bytes: 536870912
  cpu-period-micros: 100000
  cpu-quota-micros: 50000
  pids-limit: 50
  max-source-bytes: 65536
  max-output-bytes: 65536
  tmpfs-size-bytes: 33554432
