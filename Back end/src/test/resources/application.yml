spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:plagiarism_system}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  flyway:
    enabled: false

server:
  port: 0

app:
  cors:
    allowed-origins: http://localhost:3000
  ai:
    provider: none
    api-key:

sandbox:
  image: eclipse-temurin:21-jdk-alpine
  timeout-seconds: 10
  max-concurrent-executions: 4
  memory-bytes: 536870912
  cpu-period-micros: 100000
  cpu-quota-micros: 50000
  pids-limit: 50
  max-source-bytes: 65536
  max-output-bytes: 65536
  tmpfs-size-bytes: 33554432
