# ============================================================
# application-docker.yml  –  overrides for Docker Compose env
# ============================================================
# When the backend container starts it receives SPRING_PROFILES_ACTIVE=docker.
# These values override the defaults in application.yml.
# All sensitive values are read from environment variables injected by
# docker-compose.yml (sourced from the .env file).
# ============================================================

spring:
  datasource:
    # 'mysql' is the service hostname declared in docker-compose.yml
    url: ${DB_URL:jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:codeassess}?useSSL=${DB_USE_SSL:false}&sslMode=${DB_SSL_MODE:PREFERRED}&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}}
    username: ${DB_USERNAME:appuser}
    password: ${DB_PASSWORD:apppassword}
    hikari:
      pool-name: CodeAssessDockerHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      initialization-fail-timeout: 10000

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: ${PORT:8081}

app:
  cors:
    # In Docker, the frontend container name or host machine IP/domain is allowed.
    # Override with actual frontend URL at runtime if needed.
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
