# ============================================================
# application-docker.yml  –  overrides for Docker Compose env
# ============================================================
# When the backend container starts it receives SPRING_PROFILES_ACTIVE=docker.
# These values override the defaults in application.yml.
# All sensitive values are read from environment variables injected by
# docker-compose.yml (sourced from the .env file).
# ============================================================

spring:
  datasource:
    # 'mysql' is the service hostname declared in docker-compose.yml
    url: ${DB_URL:jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:codeassess}?useSSL=${DB_USE_SSL:false}&sslMode=${DB_SSL_MODE:PREFERRED}&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:appuser}
    password: ${DB_PASSWORD:apppassword}

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:15MB}

server:
  port: ${PORT:8081}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
  servlet:
    session:
      cookie:
        name: codeassess_session
        http-only: true
        secure: ${COOKIE_SECURE:false} # set to true in production HTTPS
        same-site: ${COOKIE_SAME_SITE:lax}

app:
  cors:
    # In Docker, the frontend container name or host machine IP/domain is allowed.
    # Override with actual frontend URL at runtime if needed.
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
