# ============================================================
# application-docker.yml  –  overrides for Docker Compose env
# ============================================================
# When the backend container starts it receives SPRING_PROFILES_ACTIVE=docker.
# These values override the defaults in application.yml.
# All sensitive values are read from environment variables injected by
# docker-compose.yml (sourced from the .env file).
# ============================================================

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:gateway01.ap-southeast-1.prod.aws.tidbcloud.com}:${DB_PORT:4000}/${DB_NAME:codeassess}?useSSL=${DB_USE_SSL:true}&sslMode=${DB_SSL_MODE:VERIFY_IDENTITY}&serverSslCert=${DB_SSL_CERT:/app/config/isrgrootx1.pem}&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}}
    username: ${DB_USERNAME:4WbnHmzerwdcXcw.root}
    password: ${DB_PASSWORD:3ng7Nysmy271V9iC}
    hikari:
      pool-name: CodeAssessDockerHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      initialization-fail-timeout: 10000

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT_MS:2000}ms

server:
  port: ${PORT:8081}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://*.vercel.app}}
