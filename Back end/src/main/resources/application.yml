spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:plagiarism_system}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 'validate' confirms the live schema matches entities.
      # Flyway handles all DDL; Hibernate never auto-creates or drops tables.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    # Flyway is now ENABLED. All migrations in db/migration run automatically on startup.
    enabled: true
    # baseline-on-migrate: true allows Flyway to run on an existing database that
    # has not been managed by Flyway before (e.g. created manually or via ddl-auto).
    baseline-on-migrate: true
    # Baseline version must be lower than the earliest migration we want applied.
    baseline-version: 0
    # Locations of migration SQL files (default, listed explicitly for clarity).
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        name: codeassess_session
        http-only: true
        secure: false # set to true in production
        same-site: lax
        
plagiarism:
  kgram-size: 5
  window-size: 4

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  ai:
    provider: ${AI_PROVIDER:none}
    api-key: ${AI_API_KEY:}
