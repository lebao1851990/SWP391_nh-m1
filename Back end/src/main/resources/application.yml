spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:plagiarism_system}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Kim20042005}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT_MS:2000}ms

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration

queue:
  plagiarism:
    enabled: ${QUEUE_PLAGIARISM_ENABLED:true}
    stream-name: ${QUEUE_PLAGIARISM_STREAM:codeassess:jobs:plagiarism}
    consumer-group: ${QUEUE_PLAGIARISM_GROUP:plagiarism-worker-group}
    max-retries: 3
    publish-timeout-ms: 2000
  bullmq:
    enabled: ${BULLMQ_ENABLED:true}
    producer-url: ${BULLMQ_PRODUCER_URL:http://localhost:3001}
    timeout-ms: ${BULLMQ_TIMEOUT_MS:3000}

server:
  port: ${PORT:8088}
  servlet:
    session:
      cookie:
        name: codeassess_session
        http-only: true
        secure: false # set to true in production
        same-site: lax
        
plagiarism:
  kgram-size: 5
  window-size: 4

app:
  internal:
    api-secret: ${INTERNAL_API_SECRET:codeassess-internal-secret-2026}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  ai:
    provider: ${AI_PROVIDER:none}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:30}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

sandbox:
  image: eclipse-temurin:21-jdk-alpine
  # Wall-clock timeout for compile + run combined (seconds)
  timeout-seconds: 10
  # Hard cap on concurrent sandboxed executions
  max-concurrent-executions: 4
  # Memory limit per container (bytes)
  memory-bytes: 536870912        # 512 MiB
  # CPU throttle: quota / period = 0.5 CPU
  cpu-period-micros: 100000
  cpu-quota-micros: 50000
  # Maximum process count inside container
  pids-limit: 50
  # Maximum accepted source code size (bytes, UTF-8 encoded)
  max-source-bytes: 65536
  # Maximum bytes captured from stdout / stderr each
  max-output-bytes: 65536
  # tmpfs size for /tmp inside container (bytes)
  tmpfs-size-bytes: 33554432     # 32 MiB
