version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: codeassess-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-codeassess}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - codeassess-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codeassess-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - codeassess-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  docker-proxy:
    build:
      context: ./docker-proxy
      dockerfile: Dockerfile
    container_name: codeassess-docker-proxy
    restart: unless-stopped
    environment:
      PORT: 2375
      DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - codeassess-network
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:2375/_ping" ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  sandbox-service:
    build:
      context: ./sandbox-service
      dockerfile: Dockerfile
    container_name: codeassess-sandbox-service
    restart: unless-stopped
    depends_on:
      docker-proxy:
        condition: service_healthy
    environment:
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      SANDBOX_SERVICE_URL: http://sandbox-service:8085
      PORT: 8085
      DOCKER_HOST: http://docker-proxy:2375
    ports:
      - "8085:8085"
    networks:
      - codeassess-network
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8085/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./Back end
      dockerfile: Dockerfile
    container_name: codeassess-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox-service:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-codeassess}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DB_USE_SSL: ${DB_USE_SSL:-false}
      DB_SSL_MODE: ${DB_SSL_MODE:-PREFERRED}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BULLMQ_PRODUCER_URL: http://bullmq-service:3001
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      SANDBOX_SERVICE_URL: http://sandbox-service:8085
      PORT: 8081
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${AI_API_KEY:-}}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "${PORT:-8081}:8081"
    volumes:
      - submission_data:/app/data/submissions
    networks:
      - codeassess-network
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8081/api/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  bullmq-service:
    build:
      context: ./bullmq-service
      dockerfile: Dockerfile
    container_name: codeassess-bullmq-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BACKEND_URL: http://backend:8081
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      BULLMQ_CONCURRENCY: ${BULLMQ_CONCURRENCY:-2}
      PORT: 3001
    ports:
      - "3001:3001"
    networks:
      - codeassess-network
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3001/api/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./Front end
      dockerfile: Dockerfile
    container_name: codeassess-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      BACKEND_URL: http://backend:8081
      NEXT_PUBLIC_API_URL: /api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - codeassess-network
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3000/login" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  codeassess-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  submission_data:
